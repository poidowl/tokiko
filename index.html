<style>
  :root {
    --bg: #080a0d;
    --surface: #12171e;
    --border: #232c37;
    --text: #f2ede4;
    --muted: #8f9ba8;
    --dim: #667280;
    --accent: #e85d3f;
    --brass: #d99b38;
    --teal: #2ca58d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 14px 36px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .frame-shell {
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: 480px;
    max-height: 480px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: #0c0f12;
    box-shadow: 0 20px 48px rgba(0, 0, 0, 0.52);
  }
  .frame-shell iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  .actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .btn {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.12s, color 0.12s;
  }
  .btn:hover { border-color: var(--teal); color: var(--teal); }
  .btn.primary {
    background: var(--accent);
    color: #fffaf5;
    border-color: var(--accent);
  }
  .btn.primary:hover { opacity: 0.92; color: #fffaf5; }
  .ver-panel {
    padding: 9px 11px;
    border-radius: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .ver-panel .vh {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--dim);
  }
  .ver-panel strong { color: var(--brass); }
  @media (max-width: 500px) {
    body { padding: 12px 8px 24px; }
    .frame-shell { aspect-ratio: auto; height: 480px; }
  }
</style>
</head>
<body>
<main class="wrap">
  <div class="frame-shell">
    <iframe id="playerFrame" src="./player.html?v=v0.1.2" title="tokiko / KUDA v0.1.2 正方形ライブプレイヤー"
      allow="autoplay"
      sandbox="allow-popups allow-same-origin allow-scripts allow-presentation"></iframe>
  </div>

  <div class="actions">
    <button id="wavOutBtn" class="btn" type="button">↓ WAV保存</button>
    <button id="copyUrlBtn" class="btn primary" type="button">X投稿用URLをコピー</button>
    <a class="btn" href="https://github.com/poidowl/tokiko" target="_blank" rel="noopener noreferrer">GitHub (69KB 純JS) ↗</a>
  </div>

  <section class="ver-panel" aria-label="バージョン情報">
    <div class="vh">
      <span><strong>v0.1.2</strong> · Virtual Vocal Organ KUDA</span>
      <span>MIT · 0B Weights</span>
    </div>
    <div>変更内容: ローマ字・英字入力対応 (konnichiwa / JavaScript等) ＋ 開けた瞬間自動発話 ＋ 息もれ/倍速(0.5x–2.0x)スライダ</div>
  </section>
</main>
<script>
const playerFrame = document.getElementById("playerFrame");
const wavOutBtn = document.getElementById("wavOutBtn");

window.addEventListener("message", function (ev) {
  if (!ev.data || ev.data.type !== "tokiko:wav" || !ev.data.wav) return;
  if (playerFrame && ev.source !== playerFrame.contentWindow) return;
  const blob = new Blob([ev.data.wav], { type: "audio/wav" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = ev.data.filename || "tokiko.wav";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  wavOutBtn.textContent = "✓ WAV保存しました";
  setTimeout(() => { wavOutBtn.textContent = "↓ WAV保存"; }, 1800);
});

wavOutBtn.addEventListener("click", function () {
  if (playerFrame && playerFrame.contentWindow) {
    playerFrame.contentWindow.postMessage({ type: "tokiko:getWav" }, "*");
  }
});

document.getElementById("copyUrlBtn").addEventListener("click", function () {
  const url = "https://poidowl.github.io/tokiko/";
  const btn = this;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(() => {
      btn.textContent = "✓ コピーしました";
      setTimeout(() => { btn.textContent = "X投稿用URLをコピー"; }, 2000);
    });
  }
});
</script>
</body>
</html>
